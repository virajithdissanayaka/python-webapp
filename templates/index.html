<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Web App - CI/CD Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 60px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        p {
            font-size: 1.3em;
            margin: 15px 0;
            line-height: 1.6;
        }
        .highlight {
            color: #ffd700;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
        }
        .hostname {
            color: #00ff88;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: rgba(0, 255, 136, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 10px 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🚀</div>
        <h1>Python Web App</h1>
        <p>Successfully deployed via <span class="highlight">Jenkins CI/CD Pipeline Virajith</span>!</p>
        <div class="badge">🐳 Docker</div>
        <div class="badge">🐍 Python Flask</div>
        <div class="badge">⚙️ Jenkins</div>
        <p style="margin-top: 30px;">Running on:</p>
        <div class="hostname">{{ hostname }}</div>
    </div>
</body>
</html>
